        /* 标签组 */

        .tag-item:nth-child(2) { animation-delay: 0.15s; }
        .tag-item:nth-child(3) { animation-delay: 0.30s; }
        .tag-item:nth-child(4) { animation-delay: 0.45s; }
        .tag-item:nth-child(5) { animation-delay: 0.60s; }

        /* ------------------ 2×2 整齐网格按钮组 ------------------ */
        .btn-group {

            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.03); }
            30% { transform: scale(1); }
        }

        .btn {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 13px 18px;
            font-size: 15px;
            font-weight: 800;
            border-radius: 24px;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
            animation: heartbeat 3.2s infinite ease-in-out;
            text-align: center;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(30deg) translateX(-100%);
            transition: transform 0.6s ease;
        }

        .btn:hover::after {
            transform: rotate(30deg) translateX(100%);
        }

        .btn:hover {
            animation-play-state: paused;
            transform: translateY(-2px) scale(1.02);
        }

        .btn-yellow {
            background: linear-gradient(135deg, #ffc700 0%, #ff8800 100%);
            color: #000000;
            border: none;

                liveNotice: "⚽ 本平台所有有效會員均可永久免費查看實時球賽高清直播，請註冊後下載APP使用",

                p4: "🚀 好體育 期待您的加入！",
                btnRegister: "立即註冊",
                btnPromo: "優惠活動",
                btnChat: "會員聊天室",
                btnDownloadApp: "下載APP"
            },
            'en': {
                title: "⭐ First Multi-Language & Multi-Currency Gaming Platform",
                p1_title: "🔥 Featured Entertainment Categories:",
                tags: ["Live Casino", "Cards", "Lottery", "Sports", "E-Sports", "Slots", "Fishing"],
                liveNotice: "⚽ All active members enjoy permanent free HD live streaming of matches. Please register and download the app.",
                p2: "🌐 Support dozens of languages / Multi-currency & Crypto deposits & withdrawals",
                p3: "🛡️ 32 Years Operating • Fair & Just • Secure & Instant Withdrawals",

            'vi': {
                title: "⭐ Nền tảng giải trí trực tuyến đa ngôn ngữ & tiền tệ đầu tiên",
                p1_title: "🔥 Danh mục giải trí phổ biến:",
                tags: ["Casino", "Game bài", "Xổ số", "Thể thao", "Esports", "Nổ hũ", "Bắn cá"],

                p2: "🌐 Hỗ trợ hàng chục ngôn ngữ / Tiền tệ & Tiền điện tử nạp rút tự do",
                p3: "🛡️ 32 năm hoạt động • Công bằng • An toàn & Rút tiền tức thì",
                p4: "🚀 HTY Thể Thao Chào Mừng Bạn!",
                btnRegister: "Đăng ký ngay",
                btnPromo: "Khuyến mãi",
                btnChat: "Phòng chat",
                btnDownloadApp: "Tải APP"
            }
        };

        const DEFAULT_LANG = 'zh-CN';

        function getPreferredLanguage() {
            const languages = navigator.languages || [navigator.language || navigator.userLanguage];
            for (let lang of languages) {
                if (!lang) continue;
                const fullCode = lang.toLowerCase();
                const mainCode = fullCode.split('-')[0];

                for (let key in translations) {
                    if (key.toLowerCase() === fullCode) return key;
                }
                for (let key in translations) {
                    if (key.toLowerCase() === mainCode) return key;
                }
            }
            return DEFAULT_LANG;
        }

        function applyLanguage(lang) {
            document.documentElement.lang = lang;
            
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerText = translations[lang][key];
                } else {
                    element.innerText = translations[DEFAULT_LANG][key];
                }
            });

            const tagElements = document.querySelectorAll('[data-i18n-tag]');
            const langTags = (translations[lang] && translations[lang].tags) ? translations[lang].tags : translations[DEFAULT_LANG].tags;
            tagElements.forEach((el, index) => {
                if (langTags[index]) {
                    el.innerText = langTags[index];
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const currentLang = getPreferredLanguage();
            applyLanguage(currentLang);
        });
    </script>
